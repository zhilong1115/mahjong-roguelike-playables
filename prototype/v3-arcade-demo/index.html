<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>天胡 TIANHU · 街机切片 V3</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="panel" id="roundPanel">
      <div class="rowFlex">
        <div id="roundChip">壹</div>
        <div class="grow">
          <div id="roundName" class="sh">试手局</div>
          <div id="roundMeta" class="lbl">第 1 副 / 共 3 副</div>
          <div id="flavorHint" class="hintLine">目标牌型：散手</div>
        </div>
      </div>
      <div id="targetBox">
        <div class="lbl">本轮目标 TARGET</div>
        <div id="targetVal"></div>
        <div id="targetBar"><span id="targetFill"></span></div>
        <div id="pendingLine">待结算 0 金 · 三副过关才入账</div>
      </div>
    </div>

    <div class="panel dark" id="scorePanel">
      <div id="handName" class="sh">尚未成牌</div>
      <div id="calcRow">
        <div class="calcBox" id="chipsBox">0</div>
        <div id="xSign">×</div>
        <div class="calcBox" id="multBox">1</div>
      </div>
      <div id="totalBox" class="sh">0</div>
    </div>

    <div class="panel deep" id="statPanel">
      <div class="statRow">
        <div class="stat"><div class="v" id="swapV">5</div><div class="n">换牌 SWAPS</div></div>
        <div class="stat"><div class="v" id="distV">2</div><div class="n">还差 TO HU</div></div>
        <div class="stat money"><div class="v" id="goldV">4</div><div class="n">金币 GOLD</div></div>
        <div class="stat"><div class="v" id="slotV">12金</div><div class="n" id="slotLabel">空位 6 SLOTS</div></div>
      </div>
    </div>

    <div class="panel deep grow" id="generalPanel">
      <div class="lbl">福将 GENERALS</div>
      <div id="generalBar"></div>
      <div id="sideBtns">
        <button class="btn grey sm" id="btnHelp">玩法 HOW TO PLAY</button>
        <button class="btn grey sm" id="btnRestart">重开 RESTART</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="slotBar" aria-label="开运位"></div>

    <div id="table">
      <div id="tableMark"><div class="mk">胡</div><div class="mk2">TIANHU</div></div>
      <div id="revealZone"></div>
      <div id="nextBox">
        <div class="lbl">下一张 NEXT</div>
        <div id="nextTile"></div>
        <div id="wallCount" class="lbl">牌墙 0</div>
      </div>
      <div id="draftLayer" hidden>
        <div id="draftTitle" class="sh">三签选一 · 只在本副生效</div>
        <div id="draftCards"></div>
      </div>
    </div>

    <div id="handZone"></div>

    <div id="actionRow">
      <button class="btn play" id="btnAct">选牌</button>
      <button class="btn gold" id="btnHu">胡牌 HU</button>
      <div id="actionHint" class="hintLine">点 1 张换牌，点 2–4 张亮组开运</div>
    </div>
  </main>
</div>

<div id="tip"></div>
<div id="toast"></div>
<script type="module" src="ui/app.mjs"></script>
</body>
</html>
